# Serve o app e encaminha /api/ para a porta de entrada (Kong). Assim o app e a API ficam no mesmo endereço.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # config.js e sw.js nunca ficam em cache: o instalador pode trocá-los.
    location = /config.js { add_header Cache-Control "no-store" always; }
    location = /sw.js { add_header Cache-Control "no-store" always; }
    location = /versao.txt { add_header Cache-Control "no-store" always; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
